# Force software mixer on K66 USB Audio DAC (while keeping hardware ALSA PCM at 100%)
# Without api.alsa.soft-mixer = true, PipeWire binds volume directly to K66's hardware
# PCM register (0..30), which hard-clamps volume at 1.00 (100%) and blocks >100% boost.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-K66.*" }
      { node.name = "~alsa_output.usb-K66.*" }
    ]
    actions = {
      update-props = {
        api.alsa.ignore-dB = true
        api.alsa.soft-mixer = true
      }
    }
  }
]
