# Ignore inaccurate hardware dB scale reported by K66 USB Audio DAC
# so volume scaling matches Windows loudness across 30%–100%.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-K66.*" }
      { node.name = "~alsa_output.usb-K66.*" }
    ]
    actions = {
      update-props = {
        api.alsa.ignore-dB = true
      }
    }
  }
]
